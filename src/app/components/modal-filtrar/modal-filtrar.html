<div class="modal-backdrop">
  <div class="modal">
    <h2>Filtrar tabla</h2>

    <form (ngSubmit)="aplicar()">
      <div class="form-group">
        <label>Columna:</label>
        <select [(ngModel)]="columnaSeleccionada" name="columna">
          <option [ngValue]="null">Seleccione una columna</option>
          <option *ngFor="let col of columnas" [value]="col">{{ col }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Palabra clave:</label>
        <input type="text" [(ngModel)]="palabraClave" name="palabraClave" />
      </div>

      <div class="form-actions">
        <button type="submit">Aplicar</button>
        <button type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
